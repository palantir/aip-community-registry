<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">GPT-GlassOnion governed intelligence flow</title>
<desc id="desc">A cinematic animated diagram showing authorized data moving through governance, ontology, geospatial intelligence, 24 bounded specialists, human review, and Zyra output.</desc>
<defs>
  <radialGradient id="space" cx="50%" cy="45%" r="72%"><stop offset="0" stop-color="#13234a"/><stop offset=".48" stop-color="#080d20"/><stop offset="1" stop-color="#02040b"/></radialGradient>
  <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#00d9ff"/><stop offset=".5" stop-color="#b9fbff"/><stop offset="1" stop-color="#00f0b5"/></linearGradient>
  <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#7c3cff"/><stop offset=".5" stop-color="#f146ff"/><stop offset="1" stop-color="#ff8a00"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#1b3b64" stroke-width="1"/></pattern>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62efff"/></marker>
</defs>
<style>
  .panel{fill:#071126;stroke:#244e79;stroke-width:1.5}.label{font-family:Arial,sans-serif;fill:#fff;text-anchor:middle}.micro{font-family:Arial,sans-serif;fill:#8fb7d8;text-anchor:middle;letter-spacing:1px}.route{fill:none;stroke:#2c688e;stroke-width:3;stroke-dasharray:10 13;marker-end:url(#arrow);animation:dash 2.8s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center}.orbit{transform-origin:700px 390px;animation:spin 16s linear infinite}.scan{animation:scan 4s ease-in-out infinite}.float{animation:float 3s ease-in-out infinite}.delay{animation-delay:-1.2s}@keyframes dash{to{stroke-dashoffset:-46}}@keyframes pulse{50%{opacity:.5;transform:scale(.97)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{0%,100%{transform:translateY(-155px);opacity:0}20%,80%{opacity:.7}50%{transform:translateY(155px)}}@keyframes float{50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1400" height="820" rx="32" fill="url(#space)"/><rect width="1400" height="820" rx="32" fill="url(#grid)" opacity=".42"/>
<ellipse cx="700" cy="400" rx="420" ry="260" fill="#154f99" opacity=".12" filter="url(#soft)"/>
<text x="700" y="65" class="label" font-size="38" font-weight="800" letter-spacing="7">GPT–GLASSONION</text>
<text x="700" y="100" class="micro" font-size="15">GOVERNED GEOSPATIAL INTELLIGENCE • SONOXO × ZYRA</text>
