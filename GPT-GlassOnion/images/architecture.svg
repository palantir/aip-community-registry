<circle cx="700" cy="390" r="143" fill="#080f24" stroke="url(#violet)" stroke-width="3" filter="url(#glow)" class="pulse"/>
<circle cx="700" cy="390" r="108" fill="none" stroke="#3d76a5" stroke-width="1.5" stroke-dasharray="4 10"/>
<path d="M700 300c-54 0-88 36-88 89 0 58 39 101 88 124 49-23 88-66 88-124 0-53-34-89-88-89Z" fill="#111d3d" stroke="url(#cyan)" stroke-width="3"/>
<text x="700" y="370" class="label" font-size="23" font-weight="700">GOVERNED</text><text x="700" y="402" class="label" font-size="23" font-weight="700">ONTOLOGY CORE</text><text x="700" y="438" class="micro" font-size="13">PROVENANCE • POLICY • AUDIT</text>
<rect x="584" y="230" width="232" height="4" rx="2" fill="url(#cyan)" filter="url(#glow)" class="scan"/>
<g class="float"><rect class="panel" x="60" y="180" width="270" height="126" rx="22"/><rect x="60" y="180" width="7" height="126" rx="3" fill="#00d9ff"/><text x="195" y="220" class="micro" font-size="13">01 • INPUT</text><text x="195" y="252" class="label" font-size="21" font-weight="700">AUTHORIZED SOURCES</text><text x="195" y="280" class="micro" font-size="12">PUBLIC OR APPROVED DATA</text></g>
<g class="float delay"><rect class="panel" x="60" y="510" width="270" height="126" rx="22"/><rect x="60" y="510" width="7" height="126" rx="3" fill="#00f0b5"/><text x="195" y="550" class="micro" font-size="13">02 • SPATIAL LAYER</text><text x="195" y="582" class="label" font-size="21" font-weight="700">GEOJSON MAP</text><text x="195" y="610" class="micro" font-size="12">POINT • LINE • POLYGON</text></g>
<g class="float delay"><rect class="panel" x="1070" y="180" width="270" height="126" rx="22"/><rect x="1333" y="180" width="7" height="126" rx="3" fill="#f146ff"/><text x="1205" y="220" class="micro" font-size="13">03 • EXECUTION</text><text x="1205" y="252" class="label" font-size="21" font-weight="700">24 SPECIALISTS</text><text x="1205" y="280" class="micro" font-size="12">3 → 6 → 7 → 9 BOUNDED WAVES</text></g>
<g class="float"><rect class="panel" x="1070" y="510" width="270" height="126" rx="22"/><rect x="1333" y="510" width="7" height="126" rx="3" fill="#ff9a24"/><text x="1205" y="550" class="micro" font-size="13">04 • DECISION</text><text x="1205" y="582" class="label" font-size="21" font-weight="700">HUMAN REVIEW</text><text x="1205" y="610" class="micro" font-size="12">SYNTHESIS • APPROVAL • ZYRA</text></g>
<path class="route" d="M330 243C455 243 472 318 556 351"/><path class="route" d="M330 573C458 573 476 480 563 438"/><path class="route" d="M842 350C938 314 957 243 1070 243"/><path class="route" d="M841 440C936 480 962 573 1070 573"/>
<g transform="translate(360 711)"><rect width="680" height="58" rx="29" fill="#071126" stroke="#244e79"/><circle cx="38" cy="29" r="8" fill="#00f0b5" class="pulse"/><text x="76" y="35" fill="#bcecff" font-family="Arial,sans-serif" font-size="15">CI VERIFIED</text><text x="215" y="35" fill="#4a6b86" font-family="Arial,sans-serif" font-size="15">•</text><text x="245" y="35" fill="#bcecff" font-family="Arial,sans-serif" font-size="15">TAMPER-EVIDENT</text><text x="425" y="35" fill="#4a6b86" font-family="Arial,sans-serif" font-size="15">•</text><text x="455" y="35" fill="#ffca8c" font-family="Arial,sans-serif" font-size="15">FOUNDRY TENANT: PENDING</text></g>
<text x="700" y="800" class="micro" font-size="11">REFERENCE ARCHITECTURE • NO CREDENTIALS OR CUSTOMER DATA INCLUDED</text>
</svg>